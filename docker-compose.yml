services:
  postgres:
    image: postgres:16-alpine
    container_name: doit-postgres
    environment:
      POSTGRES_USER: doit
      POSTGRES_PASSWORD: doit
      POSTGRES_DB: doit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doit -d doit"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - doit-network

  redis:
    image: redis:7-alpine
    container_name: doit-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - doit-network

  minio:
    image: minio/minio:latest
    container_name: doit-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - doit-network

  minio-init:
    image: minio/mc:latest
    container_name: doit-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/doit-media --ignore-existing;
      mc anonymous set download local/doit-media/thumbs;
      exit 0;
      "
    networks:
      - doit-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: doit-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/doit
      KC_DB_USERNAME: doit
      KC_DB_PASSWORD: doit
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      - ./infra/docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    command: start-dev --import-realm
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - doit-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: doit-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - doit-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  doit-network:
    driver: bridge
